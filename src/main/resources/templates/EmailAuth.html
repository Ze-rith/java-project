<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이메일 인증</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f7f7f4; color: #21241f;
             font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="width: 100%; background-color: #f7f7f4;">
    <tr>
        <td align="center" style="padding: 40px 16px;">
            <table role="presentation" width="480" cellspacing="0" cellpadding="0" border="0"><tr><td>
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                   style="width: 100%; max-width: 480px; background-color: #ffffff; border-radius: 12px;">
                <tr>
                    <td align="left" style="padding: 36px 28px 30px;">
                        <h1 style="margin: 0 0 10px; font-size: 24px; font-weight: 700; line-height: 1.35; color: #21241f;">
                            이메일 인증
                        </h1>
                        <p style="margin: 0 0 22px; font-size: 15px; line-height: 1.65; color: #454941;">
                            가입 화면에 아래 인증 코드를 입력해 주세요.
                        </p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td align="center" bgcolor="#f2f3ee"
                                    style="padding: 16px 12px; background-color: #f2f3ee; border-radius: 8px;">
                                    <strong style="display: block; color: #21241f; font-family: 'Courier New', monospace;
                                                   font-size: 32px; line-height: 1.25; letter-spacing: 4px;"
                                            th:text="${authNum}">000000</strong>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 12px 0 0; font-size: 13px; line-height: 1.6; color: #53574e;">
                            코드는 발급 후 5분 동안 유효합니다.
                        </p>
                        <p style="margin: 26px 0 0; padding-top: 16px; border-top: 1px solid #e8e9e4;
                                  font-size: 13px; line-height: 1.6; color: #53574e;">
                            인증을 요청하지 않으셨다면 이 메일을 무시해 주세요.
                        </p>
                    </td>
                </tr>
            </table>
            <!--[if mso]>
            </td></tr></table>
            <![endif]-->
        </td>
    </tr>
</table>
</body>
</html>
